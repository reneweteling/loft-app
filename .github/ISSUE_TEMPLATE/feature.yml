name: Feature idea
description: Something Loft should do
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: What are you trying to do?
      description: The situation you are in. The solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like Loft to handle it?
  - type: dropdown
    id: channel
    attributes:
      label: Which Loft do you run?
      options:
        - Mac App Store
        - GitHub release
        - Built from source
