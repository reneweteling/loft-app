name: Release

on:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Compute next version (dry-run)
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # semantic-release --dry-run prints either:
          #   "The next release version is X.Y.Z"         (new release)
          #   "There are no relevant changes..."           (no release)
          # It does NOT write package.json (we don't use the @semantic-release/npm plugin),
          # so we must parse the log instead of reading package.json.
          set -o pipefail
          DRY_LOG="$(pnpm semantic-release --dry-run --no-ci 2>&1 | tee /dev/stderr || true)"

          NEXT_VERSION="$(printf '%s\n' "$DRY_LOG" \
            | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{print $NF}' \
            | tail -1)"

          if [[ -z "$NEXT_VERSION" ]]; then
            echo "::warning::semantic-release dry-run did not produce a next version; falling back to latest git tag"
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            NEXT_VERSION="${LATEST_TAG#v}"
          fi

          echo "Resolved next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: macos-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version in Info.plist
        shell: bash
        run: ./scripts/update-version.sh "${{ needs.version.outputs.version }}"

      - name: Build Loft.app
        shell: bash
        run: ./scripts/build.sh

      - name: Zip app bundle
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Loft.app build/Loft.zip
          echo "Archive size: $(du -sh build/Loft.zip | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: loft-macos-v${{ needs.version.outputs.version }}
          path: build/Loft.zip
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Clean build directory
        shell: bash
        run: rm -rf build/

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: loft-macos-v${{ needs.version.outputs.version }}
          path: build/

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        shell: bash
        run: pnpm semantic-release
