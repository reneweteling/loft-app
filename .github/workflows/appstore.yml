name: App Store

# Builds the sandboxed App Store flavour and uploads it to App Store Connect.
# Runs by hand for now: pick the run, wait for processing, then submit the
# build for review in App Store Connect. Once that rhythm feels right, add a
# `release: published` trigger so every GitHub release also ships to the store.
#
# Secrets (App Store Connect > Users and Access > Integrations > App Store
# Connect API, role App Manager):
#   ASC_KEY_ID      key id, e.g. 2X9R4HXF34
#   ASC_ISSUER_ID   issuer uuid
#   ASC_KEY_P8      contents of the AuthKey_<id>.p8 file
# Signing uses Xcode cloud-managed certificates through that key, so no
# certificate export is needed.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (otherwise only build the .pkg)
        type: boolean
        default: true

jobs:
  build:
    name: Archive and upload
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version from the latest tag
        shell: bash
        run: |
          VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          ./scripts/update-version.sh "$VERSION"
          echo "Version $VERSION"

      - name: Write App Store Connect API key
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Build, export and upload
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          UPLOAD: ${{ inputs.upload && '1' || '0' }}
        run: ./scripts/build-appstore.sh

      - name: Keep the package
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: loft-appstore-pkg
          path: build/appstore/Loft.pkg
          retention-days: 7
