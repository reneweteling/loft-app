# XcodeGen spec for the Mac App Store build. `xcodegen generate` writes
# Loft.xcodeproj (git-ignored); scripts/build-appstore.sh runs it for you.
#
# The GitHub release keeps using SwiftPM + scripts/build.sh. This project
# exists because App Store submission needs an archive with entitlements,
# a provisioning profile and a signed installer package, none of which
# `swift build` can produce.
name: Loft
options:
  bundleIdPrefix: com.weteling
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.40.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.18.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: YES
    DEVELOPMENT_TEAM: ND82KXRD2Q
    CODE_SIGN_STYLE: Automatic
    # Same as the GitHub build: Apple Silicon only.
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Loft:
    type: application
    platform: macOS
    sources:
      - path: Sources/Loft
        excludes:
          - "Resources/Info.plist"
          - "Resources/AppIcon.icns"
          - "Resources/PrivacyInfo.xcprivacy"
          - "Resources/weteling-logo.svg"
      # Resources go straight into Contents/Resources, where the app reads
      # them via Bundle.main (see AboutSettingsView.wetelingLogo).
      - path: Sources/Loft/Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/Loft/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Loft/Resources/weteling-logo.svg
        buildPhase: resources
    dependencies:
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
      - package: ZIPFoundation
        product: ZIPFoundation
    entitlements:
      path: Loft.entitlements
    # No `info:` key here on purpose: XcodeGen would *write* a plist at that
    # path and overwrite the real one. INFOPLIST_FILE points at the tracked
    # file, which semantic-release stamps with the version.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weteling.loft
        PRODUCT_NAME: Loft
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Loft/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        # Reads the Apple Distribution certificate for archives; day-to-day
        # builds in Xcode fall back to the development certificate.
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
    scheme:
      testTargets:
        - LoftTests

  LoftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LoftTests
    dependencies:
      - target: Loft
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weteling.loft.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
